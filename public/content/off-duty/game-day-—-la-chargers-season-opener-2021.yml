body:
  - September 2021 — FedExField, Landover, Maryland. This gallery documents the Chargers season opener through a documentary lens, focused on atmosphere, crowd energy, and the visual rhythm of the day.
  - "More than a sports gallery, the work reflects the same instincts that shape the rest of Warrior's Lens: anticipation, timing, and finding narrative inside fast-moving environments."
